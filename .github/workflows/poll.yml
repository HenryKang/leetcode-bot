name: LeetCode poll

# Cloudflare cron isn't firing on this account, so we drive the Worker's jobs
# from GitHub Actions instead. The Worker still does all the LeetCode work; these
# jobs just hit its authenticated trigger endpoints on a schedule.
on:
  schedule:
    - cron: "*/15 * * * *" # poll for new solves
    - cron: "0 13 * * 1" # weekly recap (Mon 13:00 UTC ≈ Mon morning ET)
    - cron: "0 16 * * 0" # Sunday nudge (16:00 UTC ≈ noon ET) to members behind goal
    - cron: "5 5 * * *" # daily recap (05:05 UTC = just after midnight ET, EST & EDT)
  workflow_dispatch: # manual "Run workflow" button (runs a poll)

concurrency:
  group: leetcode-poll
  cancel-in-progress: false

env:
  WORKER_URL: https://kig-leetcode-bot.henrykang.workers.dev

jobs:
  poll:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll
        run: |
          curl -fsS "${WORKER_URL}/admin/poll?key=${ADMIN_KEY}"
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}

  summary:
    if: github.event.schedule == '0 13 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly summary
        run: |
          curl -fsS "${WORKER_URL}/admin/summary?key=${ADMIN_KEY}"
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}

  remind:
    if: github.event.schedule == '0 16 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: DM members behind their weekly goal
        run: |
          curl -fsS "${WORKER_URL}/admin/remind?key=${ADMIN_KEY}"
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}

  daily:
    if: github.event.schedule == '5 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Final poll, then post daily recap
        run: |
          curl -fsS "${WORKER_URL}/admin/poll?key=${ADMIN_KEY}"   # capture last-minute solves
          curl -fsS "${WORKER_URL}/admin/daily?key=${ADMIN_KEY}"  # post the recap
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
