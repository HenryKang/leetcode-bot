name: LeetCode poll

# Cloudflare cron doesn't fire on this account, so GitHub Actions drives the bot.
# NOTE: GitHub's scheduler is best-effort and often delays/drops runs (we've seen
# 2-5h gaps on a */15 schedule). So we DON'T rely on exact-time triggers for the
# daily/weekly/reminder jobs — /admin/poll runs a self-healing scheduler that fires
# any overdue periodic job exactly once. More cron lines below = more chances GitHub
# actually runs the poll; whenever it does, overdue recaps catch up.
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "*/13 * * * *" # staggered extra attempts to survive GitHub throttling
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: leetcode-poll
  cancel-in-progress: false

env:
  WORKER_URL: https://kig-leetcode-bot.henrykang.workers.dev

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll (also fires any overdue daily/weekly/reminder job)
        run: |
          curl -fsS "${WORKER_URL}/admin/poll?key=${ADMIN_KEY}"
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
