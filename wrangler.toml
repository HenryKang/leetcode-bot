name = "kig-leetcode-bot"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Two schedules (the scheduled handler branches on event.cron):
#   - poll every 15 min  -> detect + announce new solves
#   - weekly summary Mondays 13:00 UTC (~8-9am ET) -> leaderboard for the week that just ended
[triggers]
crons = ["*/15 * * * *", "0 13 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "kig_leetcode"
# Fill this in after `wrangler d1 create kig_leetcode`
database_id = "2e2bcad9-f0fb-43c4-8fb1-82a65f33219e"

[vars]
# Non-secret config. The only real secret is DISCORD_BOT_TOKEN, set via
# `wrangler secret put DISCORD_BOT_TOKEN`. App ID and Public Key are public.
ANNOUNCE_CHANNEL_ID = "1477080627332513997"
SUMMARY_CHANNEL_ID = "1477080627332513997"
GUILD_ID = "1473186651206455393"
DISCORD_APPLICATION_ID = "1546401996620431410"
DISCORD_PUBLIC_KEY = "d9f53e1c2f8bf56c7729a2ec3660df030d573b01c6d24f3e236ac2d1f30d8f0d"
