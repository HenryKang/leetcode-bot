name = "kig-leetcode-bot"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Two schedules (the scheduled handler branches on event.cron):
#   - poll every 15 min  -> detect + announce new solves
#   - weekly summary Mondays 13:00 UTC (~8-9am ET) -> leaderboard for the week that just ended
[triggers]
crons = ["*/15 * * * *", "0 13 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "kig_leetcode"
# Fill this in after `wrangler d1 create kig_leetcode`
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Non-secret channel/guild config. Secrets (bot token, public key) go via `wrangler secret put`.
ANNOUNCE_CHANNEL_ID = "REPLACE_WITH_LEETCODE_CHANNEL_ID"
SUMMARY_CHANNEL_ID = "REPLACE_WITH_LEETCODE_CHANNEL_ID"
GUILD_ID = "REPLACE_WITH_KIG_GUILD_ID"
